<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Single Scenario — Human vs LLM Moral Alignment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Human ↔ LLM Moral Alignment</h1>
      <p class="subtitle">Score moral scenarios for Action and Consequence valence across one or more models.</p>
    </header>

    <nav class="site-nav">
      <a href="index.html">Dashboard</a>
      <a href="single.html" class="active">Single Scenario</a>
      <a href="dataset.html">Full Dataset</a>
      <a href="export.html">Per-Model Export</a>
      <a href="agent.html">Agent</a>
    </nav>

    <section class="card">
      <h2>Single Scenario</h2>
      <label for="scenario-input">Scenario</label>
      <textarea id="scenario-input" rows="4" placeholder="Enter a moral scenario, e.g. &quot;Is it wrong to lie to protect a friend's feelings?&quot;"></textarea>

      <div class="model-select" id="single-model-select"></div>

      <div class="actions">
        <button id="run-single-btn" class="btn primary">Run Evaluation</button>
        <span id="single-status" class="status"></span>
      </div>

      <div class="table-wrap">
        <table id="single-results-table">
          <thead>
            <tr>
              <th>Model</th>
              <th>Action Valence</th>
              <th>Consequence Valence</th>
              <th>Reasoning</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="details-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3>Model reasoning</h3>
        <button id="modal-close-btn" class="btn secondary">Close</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="single.js"></script>
</body>
</html>
